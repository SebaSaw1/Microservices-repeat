server:
  port: 8070

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: amount-service
          uri: lb://AMOUNT-SERVICE
          predicates:
            - Path=/api/v1/amount/**
          filters:
            - Retry=3